<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>MyBlog</title>
	<script type="text/javascript">
		// Single Page Apps for GitHub Pages
		// MIT License — https://github.com/rafgraph/spa-github-pages
		// GitHub Pages serves this file for any path it doesn't recognize
		// (e.g. /blog/post/some-slug). It re-encodes that path into a query
		// string and redirects to index.html, where the inline script in
		// src/index.html decodes it back before Angular's router boots.
		var pathSegmentsToKeep = 1; // keep "/blog" (this repo's GitHub Pages sub-path)

		var l = window.location;
		l.replace(
			l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
			l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
			l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
			(l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
			l.hash
		);
	</script>
</head>
<body>
</body>
</html>
