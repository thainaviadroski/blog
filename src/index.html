<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Blog — Thainã Viadroski</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c121c" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="icon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="brand.svg">

  <!-- Applies the saved theme before rendering to avoid a flash of the wrong colours
       (same as the portfolio; see ThemeService) -->
  <script>
    try {
      const theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch { }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License — https://github.com/rafgraph/spa-github-pages
    // Decodes the path 404.html encoded into the query string, and
    // restores the real URL via history.replaceState before Angular's
    // router reads location.pathname.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
